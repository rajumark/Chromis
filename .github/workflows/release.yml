name: Build & Release APK

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '#go')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract version from build.gradle
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Generate release body
        run: |
          cat > release_body.md << 'EOF'
          ## Chromis APK

          **Version:** v${{ steps.version.outputs.version }}

          **AI-Powered B&W Image Colorization — 100% On-Device**

          ### Features
          - Pick any B&W or color image from your gallery
          - Colorize using DDColor ONNX model running locally
          - Side-by-side Original vs Colorized view
          - 100% offline — no data leaves your device

          ### Changelog
          ${{ github.event.head_commit.message }}

          ### Installation
          1. Download the APK below.
          2. Open it on your Android device.
          3. If prompted, allow installation from unknown sources.

          ### Device Requirements
          - Android 8.0 (API 26) or higher
          - ~200MB RAM for model inference

          ### Credits
          Built by **Raju Shingadiya** — Edge AI Project
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body_path: release_body.md
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
